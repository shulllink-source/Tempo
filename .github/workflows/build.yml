name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules /usr/share/swift
          sudo docker image prune --all --force || true
          df -h

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: |
          npm install --legacy-peer-deps
          npx expo install expo-status-bar -- --legacy-peer-deps
          npx expo install --fix

      - name: Générer le projet Android
        run: npx expo prebuild --platform android

      - name: Intégrer le code dans l'APK
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --minify false --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tempo-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
